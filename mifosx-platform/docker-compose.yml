services:
  # Frontend service
  web-app:
    image: openmf/web-app:dev
    restart: always
    environment:
      - FINERACT_API_URLS=${WEB_APP_FINERACT_API_URL:-http://localhost:${FINERACT_PORT:-3000}}
      - FINERACT_API_URL=${WEB_APP_FINERACT_API_URL:-http://localhost:${FINERACT_PORT:-3000}}
      - FINERACT_API_PROVIDER=/fineract-provider/api
      - FINERACT_API_VERSION=/v1
      - FINERACT_PLATFORM_TENANT_IDENTIFIER=${TENANT_ID:-default}
      - MIFOS_DEFAULT_LANGUAGE=en-US
      - MIFOS_SUPPORTED_LANGUAGES=cs-CS,de-DE,en-US,es-MX,fr-FR,it-IT,ko-KO,li-LI,lv-LV,ne-NE,pt-PT,sw-SW
      - MIFOS_PRELOAD_CLIENTS=true
      - MIFOS_DEFAULT_CHAR_DELIMITER=,
    ports:
      - ${WEB_APP_PORT:-4200}:80
  # Database service
  postgresql:
    image: postgres:18.3
    volumes:
      - fineract-postgresql-data:/var/lib/postgresql
      - ./fineract-db/docker/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:Z,ro
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-root}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-superuser_secure_password_here}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - FINERACT_DB_USER=${FINERACT_DB_USER:-postgres}
      - FINERACT_DB_PASS=${FINERACT_DB_PASS:-your_secure_password_here}
      - FINERACT_TENANTS_DB_NAME=${FINERACT_TENANTS_DB_NAME:-fineract_tenants}
      - FINERACT_TENANT_DEFAULT_DB_NAME=${FINERACT_TENANT_DEFAULT_DB_NAME:-fineract_default}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -d postgres -U \"$${POSTGRES_USER}\""]
      timeout: 10s
      retries: 10
    ports:
      - ${POSTGRES_PORT:-5432}:5432
  # Messaging service for Manager-Worker communication
  activemq:
    image: apache/activemq-classic:latest
    container_name: fineract-activemq
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/localhost/61616'"]
  # Backend service
  fineract-server:
    image: openmf/fineract:${TAG:-latest}
    volumes:
      - ./fineract-server/data:/data
    healthcheck:
      test: ["CMD", 'sh', '-c', 'echo -e "Checking for the availability of Fineract server deployment"; while ! nc -z "fineract-server" 8080; do sleep 1; printf "-"; done; echo -e " >> Fineract server has started";' ]
      timeout: 10s
      retries: 10
    ports:
      - ${FINERACT_PORT:-3000}:8080
    depends_on:
      postgresql:
        condition: service_healthy
      activemq:
        condition: service_healthy  
    environment:
      # NOTE: node aware scheduler
      - FINERACT_NODE_ID=1
      # NOTE: env vars prefixed "FINERACT_HIKARI_*" are used to configure the database connection pool
      - FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME=org.postgresql.Driver
      - FINERACT_HIKARI_JDBC_URL=jdbc:postgresql://postgresql:5432/${FINERACT_TENANTS_DB_NAME:-fineract_tenants}
      - FINERACT_HIKARI_USERNAME=${FINERACT_DB_USER:-postgres}
      - FINERACT_HIKARI_PASSWORD=${FINERACT_DB_PASS:-your_secure_password_here}
      # ... following variables are optional; "application.properties" contains reasonable defaults (same as here)
      - FINERACT_HIKARI_MINIMUM_IDLE=3
      - FINERACT_HIKARI_MAXIMUM_POOL_SIZE=10
      - FINERACT_HIKARI_IDLE_TIMEOUT=60000
      - FINERACT_HIKARI_CONNECTION_TIMEOUT=20000
      - FINERACT_HIKARI_TEST_QUERY=SELECT 1
      - FINERACT_HIKARI_AUTO_COMMIT=true
      - FINERACT_HIKARI_DS_PROPERTIES_CACHE_PREP_STMTS=true
      - FINERACT_HIKARI_DS_PROPERTIES_PREP_STMT_CACHE_SIZE=250
      - FINERACT_HIKARI_DS_PROPERTIES_PREP_STMT_CACHE_SQL_LIMIT=2048
      - FINERACT_HIKARI_DS_PROPERTIES_USE_SERVER_PREP_STMTS=true
      - FINERACT_HIKARI_DS_PROPERTIES_USE_LOCAL_SESSION_STATE=true
      - FINERACT_HIKARI_DS_PROPERTIES_REWRITE_BATCHED_STATEMENTS=true
      - FINERACT_HIKARI_DS_PROPERTIES_CACHE_RESULT_SET_METADATA=true
      - FINERACT_HIKARI_DS_PROPERTIES_CACHE_SERVER_CONFIGURATION=true
      - FINERACT_HIKARI_DS_PROPERTIES_ELIDE_SET_AUTO_COMMITS=true
      - FINERACT_HIKARI_DS_PROPERTIES_MAINTAIN_TIME_STATS=false
      - FINERACT_HIKARI_DS_PROPERTIES_LOG_SLOW_QUERIES=true
      - FINERACT_HIKARI_DS_PROPERTIES_DUMP_QUERIES_IN_EXCEPTION=true
      # NOTE: env vars prefixed "FINERACT_DEFAULT_TENANTDB_*" are used to create the default tenant database
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=postgresql
      - FINERACT_DEFAULT_TENANTDB_PORT=5432
      - FINERACT_DEFAULT_TENANTDB_UID=${FINERACT_DB_USER:-postgres}
      - FINERACT_DEFAULT_TENANTDB_PWD=${FINERACT_DB_PASS:-your_secure_password_here}
      - FINERACT_DEFAULT_TENANTDB_CONN_PARAMS=
      - FINERACT_DEFAULT_TENANTDB_TIMEZONE=Asia/Kolkata
      - FINERACT_DEFAULT_TENANTDB_IDENTIFIER=${TENANT_ID:-default}
      - FINERACT_DEFAULT_TENANTDB_NAME=${FINERACT_TENANT_DEFAULT_DB_NAME:-fineract_default}
      - FINERACT_DEFAULT_TENANTDB_DESCRIPTION=Default Demo Tenant
      - FINERACT_SERVER_SSL_ENABLED=false
      - FINERACT_SERVER_PORT=8080
      - FINERACT_LOGGING_LEVEL=INFO
      - FINERACT_MODE=${FINERACT_MANAGER_MODE:-WRITE}
      - FINERACT_MESSAGING_ACTIVEMQ_BROKER_URL=${FINERACT_MESSAGING_ACTIVEMQ_BROKER_URL:-tcp://activemq:61616}
      - FINERACT_REPORT_ENGINE_BIRT_ENABLED=${FINERACT_REPORT_ENGINE_BIRT_ENABLED:-true}
  # Scalable Worker service (Read-only nodes)
  fineract-worker:
    image: openmf/fineract:${TAG:-latest}
    depends_on:
      fineract-server:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: ${FINERACT_WORKERS_COUNT:-0}
    environment:
      - FINERACT_MODE=${FINERACT_WORKER_MODE:-READ}
      - FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME=org.postgresql.Driver
      - FINERACT_HIKARI_JDBC_URL=jdbc:postgresql://postgresql:5432/${FINERACT_TENANTS_DB_NAME:-fineract_tenants}
      - FINERACT_HIKARI_USERNAME=${FINERACT_DB_USER:-postgres}
      - FINERACT_HIKARI_PASSWORD=${FINERACT_DB_PASS:-your_secure_password_here}
      - FINERACT_MESSAGING_ACTIVEMQ_BROKER_URL=${FINERACT_MESSAGING_ACTIVEMQ_BROKER_URL:-tcp://activemq:61616}
  # Test runner service for pytest, Newman, and Playwright commands
  test-runner:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVER_URL=http://fineract-server:8080
      - WEB_APP_URL=http://web-app:80
      - DB_ENDPOINT=postgresql:5432/${FINERACT_TENANT_DEFAULT_DB_NAME:-fineract_default}
      - FINERACT_DB_USER=${FINERACT_DB_USER:-postgres}
      - FINERACT_DB_PASS=${FINERACT_DB_PASS:-your_secure_password_here}
      - TENANT_ID=${TENANT_ID:-default}
    depends_on:
      web-app:
        condition: service_started
      postgresql:
        condition: service_healthy
      activemq:
        condition: service_healthy
      fineract-server:
        condition: service_healthy

volumes:
  fineract-postgresql-data:
